name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Live API tests (`bun run test:live`) aren't run here:
# tasnif.soliq.uz doesn't respond to GitHub-hosted runners.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # tsdown also runs publint and attw
      - run: bun run build
